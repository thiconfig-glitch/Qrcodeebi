<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download - EBI Universal</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
body {
background-color: #000000;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 24px;
padding: 20px;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.card {
width: 100%;
max-width: 320px;
display: flex;
flex-direction: column;
gap: 8px;
}
.label {
color: #a0a0a0;
font-size: 0.9rem;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 0.05em;
text-align: center;
}
.btn {
width: 100%;
padding: 18px 24px;
border-radius: 12px;
text-decoration: none;
color: #ffffff;
font-size: 1.15rem;
font-weight: 700;
text-align: center;
display: block;
cursor: pointer;
}
.playstore {
background-color: #01875f;
}
.appstore {
background-color: #0071e3;
}
</style>
</head>
<body>
​<!-- Android -->
<div class="card">
<span class="label">Android</span>
<a class="btn playstore" href="https://play.google.com/store/apps/details?id=org.universal.ebi" target="_blank" rel="noopener noreferrer">
Google Play Store
</a>
</div>
​<!-- Apple -->
<div class="card">
<span class="label">iPhone / Apple</span>
<a class="btn appstore" href="https://apps.apple.com/br/app/ebi-universal/id6810212196" target="_blank" rel="noopener noreferrer">
App Store
</a>
</div>
​</body>
</html>
